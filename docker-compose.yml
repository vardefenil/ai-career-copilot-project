version: '3.8'

services:
  ai-career-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-career-copilot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistent resume files
      - ./data:/app/data
      # Persistent FAISS vector database
      - ./faiss_index:/app/faiss_index
      # Live reload frontend during local dev
      - ./frontend:/app/frontend
    environment:
      - PYTHONUNBUFFERED=1
